plugins {
    id 'java'
    id 'jigsaw-cosmic-reach'
}

group = p_group
version = p_version

jigsawGame {
    splitSourceSets()
}

jigsawAccess {
    addManipulators(file("$projectDir/src/common/resources/${p_id}.manipulator"))
}

//jigsawInject {
//    setModJson(file("$projectDir/src/common/resources/puzzle.mod.json"))
//}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    puzzleLoader "dev.puzzleshq:puzzle-loader-core:$puzzle_loader_core_version"
    puzzleLoader "dev.puzzleshq:puzzle-loader-cosmic:$puzzle_loader_cosmic_version"

    cosmicReach("finalforeach:cosmic-reach:${cosmic_reach_version}")

    clientImplementation "com.github.PuzzlesHQ:cosmic-api:${cosmic_api_version}:merged"
    commonImplementation "com.github.PuzzlesHQ:cosmic-api:${cosmic_api_version}:merged"

    clientImplementation("com.github.DarkMattrMaestro:imgui-integration:${imgui_integration_version}")

    clientImplementation("org.openpnp:opencv:${opencv_version}")
}

processCommonResources {
    def projectProperties = [
            "p_name": p_name,
            "p_version": ((String)version).contains(".") ? version : "0.0.0",
            "p_desc": p_desc,

            "p_id": p_id,
            "p_group": p_group,
            "p_author": p_author,

            "cosmic_reach_version": cosmic_reach_version,
            "puzzle_loader_cosmic_version": puzzle_loader_cosmic_version,
            "puzzle_loader_core_version": puzzle_loader_core_version,
            "cosmic_api_version": cosmic_api_version,

            "opencv_version": opencv_version
    ]

    inputs.properties projectProperties

    filesMatching(["puzzle.mod.json", "CommandLoadVideo.class"]) {
        expand projectProperties
    }
}

wrapper {
    gradleVersion = "8.14"
    distributionType = Wrapper.DistributionType.ALL
}

tasks.buildMergedJar {
    archiveBaseName = project.name + "-" + project.cosmic_reach_version.replace("-alpha", "")
    archiveVersion = version
    archiveClassifier = ''
}

afterEvaluate {
    tasks.named("runModdedClient") {
        environment "ITCHIO_API_KEY", itch_api_key
    }
}